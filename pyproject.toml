[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenwatch-cli"
version = "0.7.0"
description = "Scan a repository for accidentally committed secrets"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["security", "secrets", "credentials", "git", "scanning", "devsecops"]
authors = [
  { name = "tokenwatch Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/TheVoidThatConsumes/tokenwatch"
Source = "https://github.com/TheVoidThatConsumes/tokenwatch"
"Bug Tracker" = "https://github.com/TheVoidThatConsumes/tokenwatch/issues"

[project.scripts]
tokenwatch = "tokenwatch.main:main"

[tool.setuptools.packages.find]
where = ["."]